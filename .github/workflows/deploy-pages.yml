name: Deploy public beta to Pages

on:
  push:
    branches: [public-beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: public-beta
      - uses: actions/configure-pages@v5
      - name: Verify public-beta source
        run: test "$(git branch --show-current)" = "public-beta"
      - name: Build static site
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir dist
          cp index.html app.js storage.js hierarchy.js shortcuts.js styles.css dist/
          cp -R vendor dist/vendor
          sed -i "s/__SOURCE_SHA__/${SOURCE_SHA}/g" dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
