name: Deploy public beta to Pages

on:
  push:
    branches: [public-beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: public-beta
      - uses: actions/configure-pages@v6
      - name: Verify public-beta source
        run: test "$(git branch --show-current)" = "public-beta"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm install --no-audit --no-fund
      - name: Build Vite site
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: npm run build
      - name: Verify deployed source metadata
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: grep -F "name=\"source-commit\" content=\"${SOURCE_SHA}\"" dist/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
