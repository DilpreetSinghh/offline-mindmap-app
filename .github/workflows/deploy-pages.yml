name: Deploy production and public beta to Pages

on:
  push:
    branches: [main, public-beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out production
        uses: actions/checkout@v7
        with:
          ref: main
          path: production
      - name: Check out public beta
        uses: actions/checkout@v7
        with:
          ref: public-beta
          path: beta-source
      - name: Read production source SHA
        id: production-source
        working-directory: production
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Read public-beta source SHA
        id: beta-source
        working-directory: beta-source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install production dependencies
        working-directory: production
        run: npm ci --no-audit --no-fund
      - name: Build production site
        working-directory: production
        env:
          SOURCE_SHA: ${{ steps.production-source.outputs.sha }}
        run: npm run build
      - name: Install public-beta dependencies
        working-directory: beta-source
        run: npm ci --no-audit --no-fund
      - name: Build isolated public-beta site
        working-directory: beta-source
        env:
          SOURCE_SHA: ${{ steps.beta-source.outputs.sha }}
          WHITEBOARD_DATABASE_NAME: offline-whiteboard-beta-v1
        run: npm run build
      - name: Assemble production and beta routes
        run: |
          mkdir -p _site/beta
          cp -R production/dist/. _site/
          cp -R beta-source/dist/. _site/beta/
      - name: Verify assembled routes
        run: |
          test -f _site/index.html
          test -f _site/legacy/index.html
          test -f _site/beta/index.html
          test -f _site/beta/legacy/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
